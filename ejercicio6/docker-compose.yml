version: '3.8'

services:
  # Base de datos MariaDB
  mariadb:
    image: mariadb:10.11
    container_name: libros_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: Libros
      MYSQL_USER: libros_user
      MYSQL_PASSWORD: 666
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - libros_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis para gestión de sesiones y tokens
  redis:
    image: redis:7-alpine
    container_name: libros_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - libros_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

  # Aplicación Flask
  app:
    build: .
    container_name: libros_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Flask
      SECRET_KEY: docker_secret_key_change_in_production
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000
      
      # CORS
      CORS_ORIGINS: "*"
      
      # MariaDB
      MYSQL_HOST: mariadb
      MYSQL_PORT: 3306
      MYSQL_USER: libros_user
      MYSQL_PASSWORD: 666
      MYSQL_DB: Libros
      MYSQL_CURSORCLASS: DictCursor
      
      # JWT
      JWT_SECRET_KEY: docker_jwt_secret_key_change_in_production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRES_MIN: 15
      JWT_REFRESH_TOKEN_EXPIRES_DAYS: 7
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ""
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - libros_network
    volumes:
      - ./:/app
    working_dir: /app

  # Cliente web (servidor estático)
  nginx:
    image: nginx:alpine
    container_name: libros_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./styles.css:/usr/share/nginx/html/styles.css
      - ./app.js:/usr/share/nginx/html/app.js
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    networks:
      - libros_network

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local

networks:
  libros_network:
    driver: bridge
